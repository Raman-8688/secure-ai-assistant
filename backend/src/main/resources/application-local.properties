# Local profile
spring.config.activate.on-profile=local

# Load secrets only for local development
spring.config.import=optional:classpath:secrets.properties

# Database for local
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# GitHub OAuth - Local
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID_LOCAL}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET_LOCAL}
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI_LOCAL}

# Frontend URL for local
app.frontend.url=http://localhost:4200