# Local profile
spring.config.activate.on-profile=local

# GitHub OAuth - Local
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID_LOCAL}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET_LOCAL}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI_LOCAL}

# Frontend URL
app.frontend.url=${FRONTEND_URL_LOCAL}