spring.application.name=aiapi

server.port=${PORT:8080}

# Import secret.properties for sensitive data
spring.config.import=optional:classpath:secret.properties

# Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/win_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# API Keys
ai.api.key=${AI_API_KEY:}
jwt.secret=${JWT_SECRET:myLocalSecretKey123456789012345678901234567890}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Email Configuration - Values will be loaded from secret.properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${spring.mail.username}  # Will be read from secret.properties
spring.mail.password=${spring.mail.password}  # Will be read from secret.properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Logging
logging.level.org.springframework.mail=DEBUG



# OAuth2 Configuration
spring.security.oauth2.client.registration.google.client-id=${spring.security.oauth2.client.registration.google.client-id}
spring.security.oauth2.client.registration.google.client-secret=${spring.security.oauth2.client.registration.google.client-secret}
spring.security.oauth2.client.registration.google.scope=${spring.security.oauth2.client.registration.google.scope}
spring.security.oauth2.client.registration.google.redirect-uri=${spring.security.oauth2.client.registration.google.redirect-uri}