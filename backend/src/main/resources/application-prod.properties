# Production profile
spring.config.activate.on-profile=prod

# Email Provider Configuration
# Use 'sendgrid' for production, 'local' for development
app.email.provider=sendgrid

# SendGrid Configuration
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}
sendgrid.from.name=AI Assistant

# GitHub OAuth - Production
spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID_PROD}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET_PROD}
spring.security.oauth2.client.registration.github.scope=read:user,user:email
spring.security.oauth2.client.registration.github.redirect-uri=${GITHUB_REDIRECT_URI_PROD}

# Frontend URL
app.frontend.url=${FRONTEND_URL_PROD}

# Production Logging Configuration
logging.level.root=INFO
logging.level.com.example.aiapp=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG
logging.level.org.hibernate.SQL=INFO

# Log file configuration
logging.file.name=logs/application.log
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30

# Request/Response logging
logging.level.org.springframework.web.filter.CommonsRequestLoggingFilter=DEBUG

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true
management.health.defaults.enabled=true

# Info endpoint
info.app.name=AI Assistant API
info.app.version=1.0.0
info.app.environment=production