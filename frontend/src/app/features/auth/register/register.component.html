<!-- src/app/features/auth/register/register.component.html -->
<app-auth-layout
  [title]="'Create Your Account'"
  [subtitle]="'Join SecureAI Assistant and experience the power of AI with enterprise-grade security. Built with Angular, Spring Boot, and JWT Authentication.'"
  [formTitle]="'Get Started'"
  [formSubtitle]="'Create your free account'"
  [icon]="'person_add'"
  [showOAuth]="true"
  [formFirst]="true"
  [showFeatures]="true"
  [features]="features"
  [animatedLines]="animatedLines"
  [isDark]="isDark"
  [isLoading]="isLoading"
  [errorMessage]="errorMessage"
  [successMessage]="successMessage"
  (themeToggle)="toggleTheme()"
  (googleLogin)="signupWithGoogle()"
  (githubLogin)="signupWithGitHub()"
>
  <!-- Form Content -->
  <form (ngSubmit)="register()" class="auth-form">
    <div class="auth-field with-icon">
      <input 
        type="text" 
        [(ngModel)]="name" 
        name="name" 
        placeholder="Full Name" 
        autocomplete="name" 
        required
      />
      <mat-icon class="auth-field-icon">person</mat-icon>
    </div>

    <div class="auth-field with-icon">
      <input 
        type="email" 
        [(ngModel)]="email" 
        name="email" 
        placeholder="Email address" 
        autocomplete="email" 
        required
      />
      <mat-icon class="auth-field-icon">email</mat-icon>
    </div>

    <div class="auth-field with-icon">
      <input 
        [type]="hidePassword ? 'password' : 'text'" 
        [(ngModel)]="password" 
        name="password" 
        placeholder="Password (min 6 characters)" 
        autocomplete="new-password" 
        required
      />
      <button type="button" class="auth-password-toggle" (click)="hidePassword = !hidePassword">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </div>

    <div *ngIf="errorMessage" class="auth-error-msg">
      <mat-icon>error</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <button type="submit" class="auth-submit-btn" [disabled]="isLoading">
      <span *ngIf="!isLoading">Create Account</span>
      <span *ngIf="isLoading" class="auth-loading-state">
        <mat-spinner diameter="18"></mat-spinner>
        Creating account...
      </span>
    </button>
  </form>

  <!-- Extra Actions -->
  <div extraActions class="auth-form-footer">
    <p>Already have an account? <a routerLink="/login">Sign in</a></p>
  </div>

  <!-- Success Actions -->
  <div successActions class="auth-form-footer">
    <button class="auth-submit-btn" (click)="goToLogin()" style="max-width:200px;margin:0 auto;">
      Go to Login
    </button>
  </div>
</app-auth-layout>
