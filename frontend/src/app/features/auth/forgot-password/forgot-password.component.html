<!-- src/app/features/auth/forgot-password/forgot-password.component.html -->
<app-auth-layout
  [title]="'Reset Your Password'"
  [subtitle]="'Enter your registered email address and we\'ll send you a secure link to reset your password.'"
  [formTitle]="'Forgot Password'"
  [formSubtitle]="'Enter your email to receive a reset link'"
  [icon]="'lock_reset'"
  [showOAuth]="false"
  [showFeatures]="false"
  [animatedLines]="animatedLines"
  [isDark]="isDark"
  [isLoading]="isLoading"
  [errorMessage]="errorMessage"
  [successMessage]="successMessage"
  (themeToggle)="toggleTheme()"
>
  <!-- Form Content -->
  <form *ngIf="!isSubmitted" [formGroup]="forgotForm" (ngSubmit)="onSubmit()" class="auth-form">
    <div class="auth-field with-icon">
      <input 
        formControlName="email" 
        placeholder="Enter your registered email"
        autocomplete="email"
        required
      />
      <mat-icon class="auth-field-icon">email</mat-icon>
    </div>

    <div *ngIf="errorMessage" class="auth-error-msg">
      <mat-icon>error</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <button type="submit" class="auth-submit-btn" [disabled]="forgotForm.invalid || isLoading">
      <span *ngIf="!isLoading">Send Reset Link</span>
      <span *ngIf="isLoading" class="auth-loading-state">
        <mat-spinner diameter="18"></mat-spinner>
        Sending...
      </span>
    </button>
  </form>

  <!-- Extra Actions -->
  <div extraActions *ngIf="!isSubmitted" class="auth-form-footer">
    <a (click)="goToLogin()" style="cursor:pointer;">← Back to Login</a>
    <span style="color:var(--text-muted)">|</span>
    <a (click)="goToRegister()" style="cursor:pointer;">Create Account</a>
  </div>

  <!-- Success Actions -->
  <div successActions *ngIf="isSubmitted" class="auth-form-footer">
    <button class="auth-submit-btn" (click)="goToLogin()" style="max-width:200px;margin:0 auto;">
      Back to Login
    </button>
  </div>
</app-auth-layout>
