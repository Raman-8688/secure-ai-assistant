<!-- src/app/components/auth/forgot-password/forgot-password.component.html -->
<div class="forgot-password-container" [class.dark-theme]="isDark">
  <div class="forgot-card">
    <div class="card-header">
      <div class="header-icon">
        <mat-icon>lock_reset</mat-icon>
      </div>
      <h2>Forgot Password</h2>
      <p>Enter your email to receive a reset link</p>
    </div>

    <div class="card-content">
      <!-- Success State -->
      <div *ngIf="isSubmitted" class="success-state">
        <mat-icon class="success-icon">check_circle</mat-icon>
        <p class="success-message">
          Password reset link sent to your email. Please check your inbox.
        </p>
        <button mat-raised-button color="primary" (click)="goToLogin()">
          Back to Login
        </button>
      </div>

      <!-- Form -->
      <form *ngIf="!isSubmitted" [formGroup]="forgotForm" (ngSubmit)="onSubmit()">
        <div class="form-field">
          <label>Email Address</label>
          <div class="input-wrapper">
            <input 
              formControlName="email" 
              placeholder="Enter your registered email"
              autocomplete="email"
              [class.error]="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched"
            />
          </div>
          <div class="error-text" *ngIf="forgotForm.get('email')?.invalid && forgotForm.get('email')?.touched">
            <span *ngIf="forgotForm.get('email')?.hasError('required')">Email is required</span>
            <span *ngIf="forgotForm.get('email')?.hasError('email')">Please enter a valid email</span>
          </div>
        </div>

        <button 
          mat-raised-button 
          color="primary" 
          type="submit" 
          class="submit-btn"
          [disabled]="forgotForm.invalid || isLoading"
        >
          <span *ngIf="!isLoading">Send Reset Link</span>
          <span *ngIf="isLoading">
            <mat-spinner diameter="20" class="inline-spinner"></mat-spinner>
            Sending...
          </span>
        </button>

        <div class="form-footer">
          <a (click)="goToLogin()">← Back to Login</a>
          <span class="divider">|</span>
          <a (click)="goToRegister()">Create Account</a>
        </div>
      </form>
    </div>

    <!-- Theme Toggle -->
    <button class="theme-toggle" (click)="toggleTheme()">
      <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
    </button>
  </div>
</div>
