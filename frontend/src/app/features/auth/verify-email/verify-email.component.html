<!-- src/app/features/auth/verify-email/verify-email.component.html -->
<app-auth-layout
  [title]="'Verify Your Email'"
  [subtitle]="'Please verify your email address to unlock all features. Check your inbox for the OTP code sent to your email.'"
  [formTitle]="'Email Verification'"
  [formSubtitle]="'Enter the OTP sent to your email'"
  [icon]="'verified'"
  [showOAuth]="false"
  [showFeatures]="false"
  [animatedLines]="animatedLines"
  [isDark]="isDark"
  [isLoading]="isLoading"
  [errorMessage]="errorMessage"
  [successMessage]="successMessage"
  (themeToggle)="toggleTheme()"
>
  <!-- Form Content -->
  <ng-container *ngIf="!isVerified; else successState">
    <form (ngSubmit)="verifyEmail()" class="auth-form">
      <div class="auth-field with-icon" style="opacity:0.7;">
        <input 
          type="email" 
          [value]="email" 
          disabled 
          placeholder="Email address"
        />
        <mat-icon class="auth-field-icon">email</mat-icon>
      </div>
      <small style="color:var(--text-muted);font-size:12px;margin-top:-8px;margin-bottom:4px;">
        OTP sent to this email
      </small>

      <div class="auth-field with-icon">
        <input 
          type="text" 
          [(ngModel)]="otp" 
          name="otp" 
          maxlength="6" 
          placeholder="Enter 6 digit OTP"
          autocomplete="one-time-code"
          required
        />
        <mat-icon class="auth-field-icon">pin</mat-icon>
      </div>

      <div *ngIf="errorMessage" class="auth-error-msg">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage }}</span>
      </div>

      <button type="submit" class="auth-submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Verify Email</span>
        <span *ngIf="isLoading" class="auth-loading-state">
          <mat-spinner diameter="18"></mat-spinner>
          Verifying...
        </span>
      </button>
    </form>
  </ng-container>

  <!-- Success State -->
  <ng-template #successState>
    <div class="auth-success-state">
      <mat-icon class="auth-success-icon">check_circle</mat-icon>
      <p class="auth-success-message">{{ successMessage }}</p>
      <p class="auth-redirect-message">Redirecting to login...</p>
      <button class="auth-submit-btn" (click)="goToLogin()" style="max-width:200px;margin:0 auto;">
        Go to Login Now
      </button>
    </div>
  </ng-template>

  <!-- Extra Actions -->
  <div extraActions *ngIf="!isVerified" class="auth-form-footer" style="gap:8px;flex-direction:column;">
    <div style="display:flex;justify-content:center;gap:8px;align-items:center;font-size:13px;color:var(--text-secondary);">
      <span>Didn't receive OTP?</span>
      <a (click)="resendOtp()" style="cursor:pointer;" [style.pointer-events]="isResending ? 'none' : 'auto'">
        {{ isResending ? 'Sending...' : 'Resend OTP' }}
      </a>
    </div>
    <a (click)="goToLogin()" style="color:var(--accent);cursor:pointer;font-size:13px;text-align:center;">
      ← Back to Login
    </a>
  </div>
</app-auth-layout>
