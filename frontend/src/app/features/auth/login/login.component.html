<!-- src/app/features/auth/login/login.component.html -->
<app-auth-layout
  [title]="'Secure AI-Powered Assistant'"
  [subtitle]="'Built with Angular, Spring Boot, and JWT Authentication. Features real-time AI responses, chat history, voice input, and secure OAuth2 login with Google & GitHub.'"
  [formTitle]="'Welcome Back'"
  [formSubtitle]="'Sign in to continue'"
  [icon]="'lock'"
  [showOAuth]="true"
  [formFirst]="false"
  [showFeatures]="false"
  [animatedLines]="animatedLines"
  [isDark]="isDark"
  [isLoading]="isLoading"
  [errorMessage]="errorMessage"
  (themeToggle)="toggleTheme()"
  (googleLogin)="loginWithGoogle()"
  (githubLogin)="loginWithGitHub()"
>
  <!-- Form Content - This is projected into the layout -->
  <form (ngSubmit)="login()" class="auth-form">
    <div class="auth-field with-icon">
      <input 
        type="email" 
        [(ngModel)]="email" 
        name="email" 
        placeholder="Email address" 
        autocomplete="email" 
        required
      />
      <mat-icon class="auth-field-icon">email</mat-icon>
    </div>

    <div class="auth-field with-icon">
      <input 
        [type]="hidePassword ? 'password' : 'text'" 
        [(ngModel)]="password" 
        name="password" 
        placeholder="Password" 
        autocomplete="current-password" 
        required
      />
      <button type="button" class="auth-password-toggle" (click)="hidePassword = !hidePassword">
        <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
      </button>
    </div>

    <div *ngIf="errorMessage" class="auth-error-msg">
      <mat-icon>error</mat-icon>
      <span>{{ errorMessage }}</span>
    </div>

    <button type="submit" class="auth-submit-btn" [disabled]="isLoading">
      <span *ngIf="!isLoading">Sign in</span>
      <span *ngIf="isLoading" class="auth-loading-state">
        <mat-spinner diameter="18"></mat-spinner>
        Signing in...
      </span>
    </button>
  </form>

  <!-- Extra Actions -->
  <div extraActions class="auth-form-footer">
    <p>No account? <a routerLink="/register">Create one</a></p>
    <p><a routerLink="/verify-email">Verify email</a></p>
    <p><a routerLink="/forgot-password">Forgot password?</a></p>
  </div>
</app-auth-layout>
