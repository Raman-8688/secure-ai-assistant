<div class="chat-input-area">
  <div class="input-container" [class.listening]="isListening">

    <textarea
      #messageInput
      [(ngModel)]="question"
      (input)="autoResize(messageInput)"
      (keydown.enter)="handleEnter($event, messageInput)"
      placeholder="Ask anything..."
      rows="1"
      [disabled]="isLoading"
    ></textarea>

    <div class="input-actions">
      <button class="plus-btn" type="button" title="Attach file">
        <mat-icon>add</mat-icon>
      </button>

      <div class="right-actions">

        <!-- Mic button with listening animation -->
        <button
          class="mic-btn"
          [class.mic-btn--active]="isListening"
          [class.mic-btn--unsupported]="!isMicSupported()"
          type="button"
          (click)="toggleMic()"
          [title]="isListening ? 'Stop recording' : 'Start voice input'"
          [attr.aria-label]="isListening ? 'Stop recording' : 'Speak your message'"
        >
          <!-- Animated rings when listening -->
          <span class="mic-ring mic-ring--1" *ngIf="isListening"></span>
          <span class="mic-ring mic-ring--2" *ngIf="isListening"></span>

          <!-- Material Mic icon -->
          <mat-icon>{{ isListening ? 'mic_off' : 'mic' }}</mat-icon>
        </button>

        <!-- Send button -->
        <button
          class="send-button"
          type="button"
          (click)="sendMessage(messageInput)"
          [disabled]="!question.trim() || isLoading"
          title="Send message"
        >
          <mat-icon>arrow_upward</mat-icon>
        </button>

      </div>
    </div>
  </div>

  <!-- Live listening indicator bar -->
  <div class="listening-bar" *ngIf="isListening">
    <span class="listening-dot"></span>
    <span class="listening-dot"></span>
    <span class="listening-dot"></span>
    <span class="listening-text">Listening... speak now</span>
    <button class="stop-btn" type="button" (click)="toggleMic()">Stop</button>
  </div>

  <!-- Error toast -->
  <div class="mic-error-toast" *ngIf="micError">
    <mat-icon>error_outline</mat-icon>
    <span>{{ micError }}</span>
    <button class="error-close" type="button" (click)="micError = ''">
      <mat-icon>close</mat-icon>
    </button>
  </div>

  <p class="footer-note">Mini AI can make mistakes. Check important info.</p>
</div>
