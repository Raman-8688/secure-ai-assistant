<div
  class="message-wrapper"
  [class.user-message]="message.isUser"
  [class.bot-message]="!message.isUser"
>
  <div class="message-avatar">
    <div *ngIf="message.isUser" class="user-avatar" title="You">
      <mat-icon>person</mat-icon>
    </div>
    <div *ngIf="!message.isUser" class="bot-avatar" title="AI Assistant">
      <mat-icon>smart_toy</mat-icon>
    </div>
  </div>

  <div class="message-bubble" [class.typing]="message.isTyping">
    <div class="message-meta-header">
      <span class="sender-name">{{ message.isUser ? 'You' : 'Mini AI' }}</span>
      <span class="message-time">{{ formatTime(message.timestamp) }}</span>
    </div>

    <div *ngIf="message.isTyping" class="typing-indicator">
      <span></span>
      <span></span>
      <span></span>
    </div>

    <ng-container *ngIf="!message.isTyping">
      <div *ngIf="message.isUser" class="user-text">
        {{ message.text }}
      </div>

      <app-markdown-renderer
        *ngIf="!message.isUser"
        [content]="message.text"
      ></app-markdown-renderer>
    </ng-container>
  </div>
</div>
